# Whoice: download this file and run `docker compose up -d`.
# Web UI: http://127.0.0.1:18081   Direct API: http://127.0.0.1:18080 (localhost only;
# put a reverse proxy in front, or change 127.0.0.1 to 0.0.0.0 to expose them).
# Config and data live in ./data (whoice.toml is created on first start).
services:
  lookup-api:
    image: ghcr.io/xmzo/whoice-lookup-api:latest
    pull_policy: always
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "WHOICE_HEALTHCHECK_ADDR=:8080 /app/whoice-api healthcheck"]
      start_period: 10s
    restart: unless-stopped

  web:
    image: ghcr.io/xmzo/whoice-web:latest
    pull_policy: always
    ports:
      - "127.0.0.1:18081:8081"
    depends_on:
      lookup-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      start_period: 20s
    restart: unless-stopped

networks:
  default:
    name: whoice
    # Needs IPv6 enabled in the Docker daemon. After changing this, recreate the network:
    # docker compose down && docker network rm whoice; docker compose up -d
    enable_ipv6: true
